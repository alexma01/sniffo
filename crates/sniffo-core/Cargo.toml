[package]
name = "sniffo-core"
version = "0.1.1"
license = "Apache-2.0"
edition = "2024"

[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hudsucker = { version = "0.25.0", features = ["http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "logging", "webpki-tokio", "aws-lc-rs"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
local-ip-address = "0.6.13"
mdns-sd = "0.21.6"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rquickjs = "0.14"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.54.0", features = ["full"] }
tower-service = "0.3"
tracing = "0.1.44"
webpki-roots = "1"

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
