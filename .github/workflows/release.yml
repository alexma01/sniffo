name: Release

# Merging develop into main releases the version written in package.json (see `pnpm release`).
on:
  push:
    branches: [main]

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag the version if it is new
        id: tag
        run: |
          v=$(node scripts/version.mjs)
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v already released"
          else
            git tag "v$v" && git push origin "v$v"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Bundle (${{ matrix.name }})
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          # Linux (ubuntu-22.04) and Windows (windows-latest) disabled: no way to test them yet.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: jdx/mise-action@v5

      - name: Rust targets for macOS universal builds
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Unsigned builds; add APPLE_* / TAURI_SIGNING_* secrets here to sign and notarize.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: Sniffo ${{ needs.tag.outputs.tag }}
          releaseDraft: true
          args: ${{ matrix.args }}

  notes:
    name: Release notes
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "${{ needs.tag.outputs.tag }}" --generate-notes --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
