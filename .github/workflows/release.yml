name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Bundle (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          # Linux (ubuntu-22.04) and Windows (windows-latest) disabled: no way to test them yet.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Rust targets for macOS universal builds
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Unsigned builds; add APPLE_* / TAURI_SIGNING_* secrets here to sign and notarize.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sniffo ${{ github.ref_name }}
          releaseBody: See the commits since the previous release.
          releaseDraft: true
          args: ${{ matrix.args }}
