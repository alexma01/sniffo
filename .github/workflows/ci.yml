name: CI

on:
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type-check and build
        run: pnpm build

      - name: UI unit tests
        run: pnpm test:ui

      - name: Core tests
        run: cargo test -p sniffo-core

      - name: IPC command tests (every command the UI calls)
        run: cargo test -p sniffo

      # The real app (commands, proxy, events) behind src-tauri/examples/ui_bridge.rs, driven
      # through the React UI in Chromium. OS tools are fakes (shell scripts), hence not Windows.
      - name: Browser for UI tests
        if: runner.os != 'Windows'
        run: pnpm exec playwright install --with-deps chromium

      - name: UI end-to-end tests
        if: runner.os != 'Windows'
        run: pnpm exec playwright test

      - name: UI test report
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            target/playwright-report
            target/playwright-results
