name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type-check and build
        run: pnpm build

      - name: UI unit tests
        run: pnpm test:ui

      - name: Core tests
        run: cargo test -p sniffo-core

      # UI end-to-end tests (pnpm test:e2e) are run on demand only, not in CI.
      - name: IPC command tests (every command the UI calls)
        run: cargo test -p sniffo
