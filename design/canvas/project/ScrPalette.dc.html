<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sniffo command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.4; color: {{c.fg}};">
  <dc-import name="Main" direction="signal" dark="{{dark}}" hint-size="1280px,800px"></dc-import>
  <div style="position: absolute; inset: 0; background: {{c.scrim}}; display: flex; justify-content: center; align-items: flex-start; padding-top: 96px;">
    <div role="dialog" aria-label="Command palette" style="width: 640px; border-radius: 14px; overflow: hidden; background: {{c.modal}}; box-shadow: {{c.shadow}};">
      <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid {{c.border}};">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{c.muted}}; stroke-width: 2; stroke-linecap: round;"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
        <input type="text" value="rep" aria-label="Search or run" style="flex: 1; border: none; outline: none; background: transparent; color: {{c.fg}}; font: inherit; font-size: 16px;">
        <kbd style="font-family: Inter, sans-serif; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid {{c.border}}; color: {{c.muted}};">esc</kbd>
      </label>
      <div style="padding: 6px;">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">{{g.title}}</div>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <div role="option" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; background: {{it.bg}};">
              <span style="min-width: 54px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: {{it.tagFg}};">{{it.tag}}</span>
              <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: {{it.font}};">{{it.label}}</span>
              <span style="font-size: 12px; color: {{c.muted}};">{{it.hint}}</span>
            </div>
          </sc-for>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid {{c.border}}; font-size: 12px; color: {{c.muted}}; background: {{c.foot}};">
        <span>↑↓ navigate</span><span>↵ run</span><span>⌘↵ run on all visible</span><span style="flex: 1;"></span><span>Sniffo</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const c = dark
      ? { border: '#2a2b30', fg: '#ececef', muted: '#8d8f98', accentText: '#c6f24e', info: '#60a5fa', ok: '#34d399', sel: 'rgba(198,242,78,0.14)', scrim: 'rgba(0,0,0,0.35)', modal: '#1a1b1e', foot: '#17181b', shadow: '0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08)' }
      : { border: '#e1e1dc', fg: '#18181b', muted: '#686870', accentText: '#4d7c0f', info: '#2563eb', ok: '#047857', sel: 'rgba(198,242,78,0.35)', scrim: 'rgba(20,20,22,0.18)', modal: '#ffffff', foot: '#f3f3f1', shadow: '0 24px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06)' };
    const sans = 'Inter, sans-serif';
    const mono = "'JetBrains Mono', monospace";
    const A = (label, hint, on) => ({ tag: 'ACTION', tagFg: c.accentText, label, hint, font: sans, bg: on ? c.sel : 'transparent' });
    const groups = [
      { title: 'Actions', items: [A('Repeat selected flow', '⌘R', true), A('Edit & Repeat…', '⌘E'), A('Compose request', '⌘N')] },
      { title: 'Hosts', items: [{ tag: 'HOST', tagFg: c.muted, label: 'reports.acme.test', hint: '12 flows', font: mono, bg: 'transparent' }] },
      { title: 'Flows', items: [
        { tag: 'GET', tagFg: c.info, label: 'api.github.com/repos/acme/web/releases?per_page=5', hint: '#4188', font: mono, bg: 'transparent' },
        { tag: 'POST', tagFg: c.ok, label: 'app.acme.test/api/v2/reports/export', hint: '#4203', font: mono, bg: 'transparent' }
      ] }
    ];
    return { c, dark, groups };
  }
}
</script>
</body>
</html>
