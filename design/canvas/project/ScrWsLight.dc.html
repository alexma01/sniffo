<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sniffo WebSocket view light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" direction="signal" dark="{{no}}" view="ws" show-console="{{yes}}" hint-size="1280px,800px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, no: false }; }
}
</script>
</body>
</html>
