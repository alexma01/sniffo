<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sniffo rules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.4; color: {{c.fg}};">
  <dc-import name="Main" direction="signal" dark="{{dark}}" hint-size="1280px,800px"></dc-import>
  <div style="position: absolute; inset: 0; background: {{c.scrim}}; display: flex; align-items: center; justify-content: center;">
    <div role="dialog" aria-label="Rules" style="width: 900px; height: 620px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: {{c.modal}}; box-shadow: {{c.shadow}};">
      <div style="display: flex; align-items: center; gap: 8px; padding: 16px 22px; border-bottom: 1px solid {{c.border}};">
        <div style="font-size: 17px; font-weight: 600;">Rules</div>
        <span style="color: {{c.muted}};">· 4 of 5 active · first match wins</span>
        <span style="flex: 1;"></span>
        <button type="button" style="height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 500;">Import…</button>
        <button type="button" style="height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 500;">Export…</button>
        <button type="button" style="height: 28px; padding: 0 12px; border-radius: 8px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; font: inherit; font-size: 12px; font-weight: 600;">+ Add rule</button>
      </div>
      <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 22px; display: flex; flex-direction: column; gap: 14px;">
        <div style="border: 1px solid {{c.border}}; border-radius: 10px; overflow: hidden;">
          <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid {{c.border}}; opacity: {{r.opacity}};">
              <span style="width: 30px; height: 18px; padding: 2px; box-sizing: border-box; border-radius: 999px; display: flex; justify-content: {{r.knob}}; background: {{r.track}};"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{r.knobBg}};"></span></span>
              <span style="width: 128px; flex: none;"><span style="display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: {{r.tagFg}}; background: {{r.tagBg}};">{{r.type}}</span></span>
              <span style="flex: 1; min-width: 0;">
                <span style="display: block; font-weight: 500;">{{r.name}}</span>
                <span style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{c.muted}};">{{r.match}}</span>
              </span>
              <span style="font-size: 12px; color: {{c.muted}};">{{r.methods}}</span>
              <span style="display: flex; gap: 4px;">
                <button type="button" aria-label="Move up" style="width: 26px; height: 26px; border-radius: 7px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.muted}}; font: inherit;">↑</button>
                <button type="button" aria-label="Move down" style="width: 26px; height: 26px; border-radius: 7px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.muted}}; font: inherit;">↓</button>
                <button type="button" style="height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.fg}}; font: inherit; font-size: 12px;">Edit</button>
              </span>
            </div>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div style="padding: 12px 14px; border-radius: 10px; border: 1px solid {{c.border}}; display: flex; gap: 12px; align-items: flex-start;">
            <span style="width: 30px; height: 18px; flex: none; padding: 2px; box-sizing: border-box; border-radius: 999px; display: flex; justify-content: flex-end; background: {{c.accent}};"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{c.onAccent}};"></span></span>
            <span><b>No Caching</b><br><span style="font-size: 12px; color: {{c.muted}};">Strip cache headers so every request hits the server.</span></span>
          </div>
          <div style="padding: 12px 14px; border-radius: 10px; border: 1px solid {{c.border}}; display: flex; gap: 12px; align-items: flex-start;">
            <span style="width: 30px; height: 18px; flex: none; padding: 2px; box-sizing: border-box; border-radius: 999px; display: flex; justify-content: flex-start; background: {{c.field}};"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{c.muted}};"></span></span>
            <span><b>Allow list</b><br><span style="font-size: 12px; color: {{c.muted}};">Record only matching hosts, e.g. <span style="font-family: 'JetBrains Mono', monospace;">*api.acme.test*</span></span></span>
          </div>
        </div>
      </div>
      <div style="flex: none; display: flex; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid {{c.border}};">
        <button type="button" style="height: 30px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.fg}}; font: inherit; font-weight: 500;">Close</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const c = dark
      ? { field: '#2a2b30', raised: '#25262b', border: '#2a2b30', fg: '#ececef', muted: '#8d8f98', accent: '#c6f24e', onAccent: '#111214', scrim: 'rgba(0,0,0,0.5)', modal: '#1a1b1e', shadow: '0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)', ok: '#34d399', warn: '#fbbf24', err: '#f87171', redirect: '#a78bfa', info: '#60a5fa' }
      : { field: '#e1e1dc', raised: '#ffffff', border: '#e1e1dc', fg: '#18181b', muted: '#686870', accent: '#c6f24e', onAccent: '#18181b', scrim: 'rgba(20,20,22,0.28)', modal: '#ffffff', shadow: '0 24px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06)', ok: '#047857', warn: '#a16207', err: '#dc2626', redirect: '#7c3aed', info: '#2563eb' };
    const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const RAW = [
      ['Breakpoint', c.warn, 'Pause checkout requests', 'https://app.acme.test/api/v2/checkout*', 'POST', true],
      ['Map Local', c.ok, 'Mock feature flags', 'https://app.acme.test/api/v2/flags', 'GET', true],
      ['Map Remote', c.info, 'Point prod API to staging', 'https://api.acme.test/* → https://staging-api.acme.test', 'Any', true],
      ['Script', c.redirect, 'Add auth header', 'https://app.acme.test/api/v2/*', 'Any', true],
      ['Throttle', c.err, 'Slow 3G on images', '*://cdn.acme.test/* · 300 ms · 96 KB/s', 'Any', false]
    ];
    const rules = RAW.map((r) => ({
      type: r[0], tagFg: r[1], tagBg: tint(r[1], dark ? 0.15 : 0.11), name: r[2], match: r[3], methods: r[4],
      opacity: r[5] ? 1 : 0.5, knob: r[5] ? 'flex-end' : 'flex-start', track: r[5] ? c.accent : c.field, knobBg: r[5] ? c.onAccent : c.muted
    }));
    return { c, dark, rules };
  }
}
</script>
</body>
</html>
