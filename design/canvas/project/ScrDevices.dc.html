<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sniffo devices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: {{c.fg}};">
  <dc-import name="Main" direction="signal" dark="{{dark}}" hint-size="1280px,800px"></dc-import>
  <div style="position: absolute; inset: 0; background: {{c.scrim}}; display: flex; align-items: center; justify-content: center;">
    <div role="dialog" aria-label="Devices" style="width: 900px; height: 660px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: {{c.modal}}; box-shadow: {{c.shadow}};">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 1px solid {{c.border}};">
        <div style="font-size: 17px; font-weight: 600;">Devices</div>
        <div style="display: flex; padding: 2px; border-radius: 8px; background: {{c.field}};">
          <button type="button" style="height: 26px; padding: 0 12px; border: none; border-radius: 6px; font: inherit; font-size: 12px; background: transparent; color: {{c.muted}};">Simulators &amp; USB</button>
          <button type="button" style="height: 26px; padding: 0 12px; border: none; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500; background: {{c.raised}}; color: {{c.fg}}; box-shadow: {{c.segShadow}};">Wi-Fi device</button>
        </div>
      </div>
      <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; gap: 24px; padding: 20px 22px;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <div style="padding: 12px 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.chrome}};">
              <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">Server</div>
              <div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;">sniffo.local</div>
              <div style="font-size: 12px; color: {{c.muted}};">or <span style="font-variant-numeric: tabular-nums; color: {{c.fg}};">192.168.1.23</span> if the device can't resolve it</div>
            </div>
            <div style="padding: 12px 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.chrome}};">
              <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">Port</div>
              <div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;">9191</div>
            </div>
          </div>
          <div style="display: flex; padding: 2px; border-radius: 8px; background: {{c.field}}; align-self: flex-start;">
            <button type="button" style="height: 24px; padding: 0 12px; border: none; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 500; background: {{c.raised}}; color: {{c.fg}}; box-shadow: {{c.segShadow}};">iPhone / iPad</button>
            <button type="button" style="height: 24px; padding: 0 12px; border: none; border-radius: 6px; font: inherit; font-size: 12px; background: transparent; color: {{c.muted}};">Android</button>
          </div>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px;">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
              <li style="display: flex; gap: 10px; padding: 8px 10px; border-radius: 9px; background: {{s.bg}}; border: 1px solid {{s.line}};">
                <span style="width: 20px; height: 20px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{s.numBg}}; color: {{s.numFg}};">{{s.n}}</span>
                <span><b>{{s.title}}</b> <span style="color: {{c.muted}};">{{s.text}}</span></span>
              </li>
            </sc-for>
          </ol>
        </div>
        <div style="width: 230px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 4px;">
          <div style="padding: 12px; border-radius: 14px; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);">
            <div role="img" aria-label="QR code for http://sniffo.cert" style="width: 189px; height: 189px; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr));">
              <sc-for list="{{qr}}" as="q" hint-placeholder-count="441"><span style="background: {{q}};"></span></sc-for>
            </div>
          </div>
          <div style="text-align: center; font-size: 12px; color: {{c.muted}};">Scan with the phone camera to open<br><span style="font-family: 'JetBrains Mono', monospace; color: {{c.fg}};">http://sniffo.cert</span></div>
        </div>
      </div>
      <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid {{c.border}};">
        <span style="font-size: 12px; color: {{c.muted}};">When you're done, set the phone's proxy back to Off.</span>
        <span style="flex: 1;"></span>
        <button type="button" style="height: 30px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.raised}}; color: {{c.fg}}; font: inherit; font-weight: 500;">Close</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const c = dark
      ? { chrome: '#17181b', field: '#1d1e22', raised: '#25262b', border: '#2a2b30', fg: '#ececef', muted: '#8d8f98', accent: '#c6f24e', onAccent: '#111214', warn: '#fbbf24', warnTint: 'rgba(251,191,36,0.1)', scrim: 'rgba(0,0,0,0.5)', modal: '#1a1b1e', segShadow: '0 1px 2px rgba(0,0,0,0.4)', shadow: '0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)' }
      : { chrome: '#f3f3f1', field: '#e9e9e5', raised: '#ffffff', border: '#e1e1dc', fg: '#18181b', muted: '#686870', accent: '#c6f24e', onAccent: '#18181b', warn: '#a16207', warnTint: 'rgba(161,98,7,0.08)', scrim: 'rgba(20,20,22,0.28)', modal: '#ffffff', segShadow: '0 1px 2px rgba(0,0,0,0.08)', shadow: '0 24px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06)' };
    const RAW = [
      ['Proxy', 'Settings → Wi-Fi → ⓘ → Configure Proxy → Manual → server and port above.'],
      ['Download the certificate', 'In Safari open http://sniffo.cert or scan the QR → Download for iOS.'],
      ['Install it', 'Settings → General → VPN & Device Management → Sniffo Root CA → Install.'],
      ['Trust it', 'General → About → Certificate Trust Settings → turn on Sniffo Root CA. Without it iOS says “not private”.', true],
      ['Choose what to decrypt', 'Enable SSL Proxying per host from the sidebar or the flow row.']
    ];
    const steps = RAW.map((s, i) => ({
      n: i + 1, title: s[0], text: s[1],
      bg: s[2] ? c.warnTint : 'transparent', line: s[2] ? c.warn : 'transparent',
      numBg: s[2] ? c.warn : c.accent, numFg: c.onAccent
    }));
    // ponytail: decorative pseudo-QR (finder squares + seeded noise), not a scannable code
    const qr = [];
    let seed = 7;
    const finder = (x, y) => {
      for (const [ox, oy] of [[0, 0], [14, 0], [0, 14]]) {
        const dx = x - ox, dy = y - oy;
        if (dx >= 0 && dx < 7 && dy >= 0 && dy < 7) return (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx > 1 && dx < 5 && dy > 1 && dy < 5)) ? 1 : 0;
      }
      return -1;
    };
    for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
      const f = finder(x, y);
      seed = (seed * 9301 + 49297) % 233280;
      const on = f === -1 ? seed / 233280 > 0.52 : f === 1;
      qr.push(on ? '#111214' : '#ffffff');
    }
    return { c, dark, steps, qr };
  }
}
</script>
</body>
</html>
